[package]
name = "presence-for-slack"
version = "0.1.0"
description = "A compact macOS people and presence companion for Slack"
authors = ["Joseph Kim"]
license = "MIT"
edition = "2021"
rust-version = "1.88"

[lib]
name = "presence_for_slack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dotenvy = "0.15"
futures-util = "0.3"
keyring = "4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tokio = { version = "1", features = ["io-util", "net", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
